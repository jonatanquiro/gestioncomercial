name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# MariaDB 10.4 y PHP 8.2 son las versiones que trae XAMPP 8.2: si pasa acá, corre en XAMPP.
# Las contraseñas de abajo son de bases efímeras de CI, no credenciales reales.

jobs:
  php:
    name: PHP · pruebas contra MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gestioncomercial_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/server
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: gestioncomercial_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Estilo (Pint)
        run: vendor/bin/pint --test
      - name: Pruebas (registro, aislamiento entre comercios, permisos por ruta, reglas, plataforma)
        run: vendor/bin/phpunit --log-junit junit.xml
      - name: Fallas como anotaciones del PR
        if: failure()
        run: |
          php -r '
            if (! is_file("junit.xml")) { exit; }
            $xml = simplexml_load_file("junit.xml");
            foreach ($xml->xpath("//testcase[failure or error]") as $case) {
              $node = $case->failure ?: $case->error;
              $msg = substr(trim((string) $node), 0, 1500);
              echo "::error title=".$case["class"]."::".$case["name"].": ".str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], $msg)."\n";
            }'

  web:
    name: Web · tipos, pruebas y archivos generados al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: El catálogo de Laravel coincide con packages/contracts
        run: |
          pnpm catalog
          git diff --exit-code apps/server/database/catalog.json || (echo "Corré 'pnpm catalog' y commiteá el resultado" && exit 1)
      - name: La web compilada está al día (XAMPP la usa sin Node)
        run: |
          pnpm build
          if [ -n "$(git status --porcelain apps/server/public/spa)" ]; then
            git status --porcelain apps/server/public/spa
            echo "Corré 'pnpm build' y commiteá apps/server/public/spa"; exit 1
          fi

  e2e:
    name: Prueba E2E en navegador
    runs-on: ubuntu-latest
    needs: [php, web]
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gestioncomercial
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: gestioncomercial
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: "1025"
      APP_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Preparar Laravel
        working-directory: apps/server
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env && php artisan key:generate
          php artisan migrate --force
      - name: Operador de plataforma efímero
        working-directory: apps/server
        run: |
          PASS="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$PASS"
          OUT=$(PLATFORM_ADMIN_PASSWORD="$PASS" php artisan platform:create-admin admin-ci@example.com "Admin CI")
          SECRET=$(echo "$OUT" | sed -n 's/^ *Clave manual: //p')
          echo "::add-mask::$SECRET"
          {
            echo "E2E_PLATFORM_EMAIL=admin-ci@example.com"
            echo "E2E_PLATFORM_PASSWORD=$PASS"
            echo "E2E_PLATFORM_TOTP_SECRET=$SECRET"
          } >> "$GITHUB_ENV"
      - name: Levantar la aplicación
        working-directory: apps/server
        run: |
          nohup php artisan serve --port=8000 > ../../server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/v1/health && exit 0; sleep 1; done
          cat ../../server.log; exit 1
      - name: E2E
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_MAILPIT_URL: http://localhost:8025
          E2E_SCREENSHOTS_DIR: e2e-screenshots
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidencia
          path: |
            e2e-screenshots
            server.log
            apps/server/storage/logs
